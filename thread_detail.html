<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thread Detail – Primal Lab</title>

<style>
  html {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #fff 0%, #e9fbf2 20%, #c9f3df 40%, #5ad9a5 60%, #c9f3df 80%, #fff 100%);
    background-size: 400% 400%;
    background-attachment: fixed;
    animation: gradientShift 20s ease infinite;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100%;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: none;
    overscroll-behavior-x: none;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>

<link rel="stylesheet" href="thread_detail.css">
<link rel="stylesheet" href="darkmode.css">
</head>
<body>

<div class="bg-gradient"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<button class="back-btn" onclick="window.location.href='threads.html'">← Back</button>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title" id="threadTitleHeader">Thread</h1>
  </div>
</section>

<section class="detail-section">
  <div class="detail-container">
    
    <div class="reply-form-card">
      <form id="newReplyForm" class="reply-form">
        <textarea id="replyBody" placeholder="Write your reply..." required></textarea>
        
        <div class="image-upload-section">
          <label for="imageUpload" class="image-upload-label">
            📷 Add Images (up to 5)
          </label>
          <input 
            type="file" 
            id="imageUpload" 
            class="image-upload-input"
            accept="image/*"
            multiple
          >
          
          <div id="imagePreviewContainer" class="image-preview-container" style="display: none;"></div>
        </div>

        <button type="submit" class="btn primary" id="submitBtn">Post Reply</button>
      </form>
    </div>

    <div id="repliesFeed" class="replies-list">
    </div>

  </div>
</section>

<div id="toast" class="toast">
  <div class="toast-content">
    <span class="toast-message"></span>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://nqomiajgtmxxsupjgvvu.supabase.co",
  "sb_publishable_b8tpSFMffPkoDRqehct7nQ_g5HjWpxA"
);

const repliesFeed = document.getElementById("repliesFeed");
const newReplyForm = document.getElementById("newReplyForm");
const replyBody = document.getElementById("replyBody");
const threadTitleHeader = document.getElementById("threadTitleHeader");
const toast = document.getElementById("toast");
const toastMessage = toast.querySelector(".toast-message");
const imageUpload = document.getElementById("imageUpload");
const imagePreviewContainer = document.getElementById("imagePreviewContainer");
const submitBtn = document.getElementById("submitBtn");

const urlParams = new URLSearchParams(window.location.search);
const thread_id = urlParams.get("thread_id");

const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23999'><path d='M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z'/></svg>";

let selectedImages = [];

if (!thread_id) {
  repliesFeed.innerHTML = "<p class='error-msg'>No thread selected.</p>";
}

imageUpload.addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []).slice(0, 5);
  if (!files.length) return;

  const valid = [];
  for (const file of files) {
    if (file.size > 5 * 1024 * 1024) {
      showToast("Each image must be less than 5MB");
      continue;
    }
    valid.push(file);
  }
  selectedImages = valid.slice(0, 5);
  renderImagePreviews();
});

function renderImagePreviews() {
  imagePreviewContainer.innerHTML = "";
  if (!selectedImages.length) {
    imagePreviewContainer.style.display = "none";
    return;
  }
  imagePreviewContainer.style.display = "grid";
  selectedImages.forEach((file, idx) => {
    const item = document.createElement("div");
    item.className = "image-preview-item";
    const img = document.createElement("img");
    img.className = "image-preview";
    img.alt = "Preview";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "remove-image-btn";
    btn.textContent = "×";
    btn.addEventListener("click", () => {
      selectedImages.splice(idx, 1);
      renderImagePreviews();
    });
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    item.appendChild(img);
    item.appendChild(btn);
    imagePreviewContainer.appendChild(item);
  });
}

function getPublicImageUrl(path) {
  if (!path) return defaultAvatar;
  
  const { data } = supabase.storage
    .from('profile-images')
    .getPublicUrl(path);
  
  return `${data.publicUrl}?v=${Date.now()}`;
}

function getReplyImageUrl(path) {
  if (!path) return null;
  
  const { data } = supabase.storage
    .from('reply-images')
    .getPublicUrl(path);
  
  return data.publicUrl;
}

function showToast(message) {
  toastMessage.textContent = message;
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

async function getProfileImage(userId) {
  try {
    const { data, error } = await supabase
      .from("profiles")
      .select("profile_image_url")
      .eq("id", userId)
      .single();
    
    if (error || !data) {
      return defaultAvatar;
    }
    
    return getPublicImageUrl(data.profile_image_url);
  } catch (err) {
    console.error("Error loading profile image:", err);
    return defaultAvatar;
  }
}

async function loadThread() {
  const { data, error } = await supabase
    .from("main_threads")
    .select("*")
    .eq("id", thread_id)
    .single();

  if (error || !data) {
    threadTitleHeader.textContent = "Thread not found";
    return;
  }

  threadTitleHeader.textContent = data.title;
}

async function loadReplies() {
  const { data: { user } } = await supabase.auth.getUser();
  const currentUserId = user?.id || null;

  const { data, error } = await supabase
    .from("replies")
    .select(`
      id,
      body,
      created_at,
      author_id,
      image_urls,
      profiles!inner(display_name)
    `)
    .eq("main_thread_id", thread_id)
    .order("created_at", { ascending: true });

  if (error) {
    repliesFeed.innerHTML = "<p class='error-msg'>Error loading replies</p>";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    repliesFeed.innerHTML = "<p class='empty-msg'>No replies yet. Be the first!</p>";
    return;
  }

  const imagePromises = data.map(r => getProfileImage(r.author_id));
  const profileImages = await Promise.all(imagePromises);

  repliesFeed.innerHTML = data.map((r, index) => {
    const profileImg = profileImages[index];
    const replyImageUrls = Array.isArray(r.image_urls) ? r.image_urls.map(getReplyImageUrl).filter(Boolean) : [];
    const canDelete = currentUserId && r.author_id === currentUserId;
    
    return `
    <div class="reply-card" data-reply-id="${r.id}" style="animation-delay: ${index * 0.08}s">
      <div class="reply-header">
        <div class="reply-author-section">
          <img src="${profileImg}" alt="Profile" class="reply-avatar">
          <strong class="reply-author">${r.profiles.display_name}</strong>
        </div>
        <div class="reply-actions">
          <span class="reply-date">${new Date(r.created_at).toLocaleString()}</span>
          ${canDelete ? `<button class="reply-delete" data-reply-id="${r.id}">Delete</button>` : ""}
        </div>
      </div>
      <p class="reply-body">${r.body}</p>
      ${replyImageUrls.length ? `
        <div class="reply-images">
          ${replyImageUrls.map(url => `<img src="${url}" alt="Reply image" class="reply-image">`).join("")}
        </div>
      ` : ''}
    </div>
  `;
  }).join("");

  setTimeout(() => {
    document.querySelectorAll('.reply-card').forEach(card => {
      card.classList.add('animate-card');
    });
  }, 50);

  document.querySelectorAll(".reply-delete").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const replyId = btn.dataset.replyId;
      if (!replyId) return;
      const { error: delError } = await supabase.from("replies").delete().eq("id", replyId);
      if (delError) {
        showToast("Delete failed");
        return;
      }
      showToast("Reply deleted");
      await loadReplies();
    });
  });
}

async function uploadImage(file, userId) {
  const fileExt = file.name.split('.').pop();
  const unique = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const fileName = `${userId}/${unique}.${fileExt}`;
  
  const { data, error } = await supabase.storage
    .from('reply-images')
    .upload(fileName, file);

  if (error) {
    console.error("Upload error:", error);
    throw error;
  }

  return fileName;
}

newReplyForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = replyBody.value.trim();
  if (!body) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "Posting...";

  try {
    const { data: { user }, error: userError } = await supabase.auth.getUser();
    if (userError || !user) {
      showToast("You must be logged in to post");
      submitBtn.disabled = false;
      submitBtn.textContent = "Post Reply";
      return;
    }

    const userId = user.id;

    const { data: profileData } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", userId)
      .single();

    if (!profileData) {
      const { error: insertError } = await supabase
        .from("profiles")
        .insert([{ id: userId, display_name: `User${userId.substring(0, 6)}` }]);
      if (insertError) {
        console.error("Error creating profile:", insertError);
        showToast("Cannot create profile. Check console.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Post Reply";
        return;
      }
    }

    let imageUrls = [];
    if (selectedImages.length) {
      try {
        const uploads = await Promise.all(selectedImages.map(f => uploadImage(f, userId)));
        imageUrls = uploads.filter(Boolean);
      } catch (uploadError) {
        console.error("Image upload failed:", uploadError);
        showToast("Image upload failed, posting without images");
      }
    }

    const { data: replyData, error: replyError } = await supabase
      .from("replies")
      .insert([{ 
        body, 
        main_thread_id: thread_id, 
        author_id: userId,
        image_urls: imageUrls 
      }])
      .select();

    if (replyError) {
      console.error(replyError);
      showToast("Error posting reply");
      submitBtn.disabled = false;
      submitBtn.textContent = "Post Reply";
      return;
    }

    replyBody.value = "";
    selectedImages = [];
    imageUpload.value = "";
    imagePreviewContainer.style.display = "none";
    imagePreviewContainer.innerHTML = "";
    
    showToast("Reply posted!");
    await loadReplies();
  } catch (error) {
    console.error("Error:", error);
    showToast("An error occurred");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Post Reply";
  }
});

loadThread();
loadReplies();
</script>
<script src="darkmode.js"></script>

</body>
</html>
